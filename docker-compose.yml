# Local development services. Production uses managed Postgres (Supabase/Neon) and Upstash Redis.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flariane
      POSTGRES_PASSWORD: flariane
      POSTGRES_DB: flariane
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
volumes:
  pgdata:
