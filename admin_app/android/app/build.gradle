plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.regisse.flariane.admin"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.regisse.flariane.admin"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23 // biometrics, secure storage
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        resValue "string", "app_name", "Flariane Admin"
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    // prod: the production admin app (default package, what the team uses day to day).
    // integration: the test backend, installed next to prod under its own name and package.
    //   flutter run --flavor integration --dart-define=API_BASE_URL=https://flariane-api-test.onrender.com
    flavorDimensions "env"
    productFlavors {
        prod {
            dimension "env"
        }
        integration {
            dimension "env"
            applicationIdSuffix ".integration"
            resValue "string", "app_name", "Flariane Admin TEST"
        }
    }
}

flutter {
    source = "../.."
}
