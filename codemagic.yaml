# Codemagic: build the customer app for iOS and send it to TestFlight.
#
# This Mac (macOS 13, Xcode 15.2) cannot submit to the App Store, which needs
# Xcode 16+. Codemagic builds on its own Macs with a current Xcode.
#
# One-time setup (codemagic.io):
#   1. Add the GitHub repository giss1408/flariane.
#   2. Team settings → Integrations → Developer Portal → connect an App Store
#      Connect API key (App Manager role) and name it "flariane-asc".
#   3. App Store Connect: create the app with bundle ID com.regisse.flariane.
# Then start the "customer-ios" workflow, by hand or by pushing a tag
# customer-v* (e.g. git tag customer-v1.0.0 && git push origin customer-v1.0.0).

workflows:
  customer-ios:
    name: Customer app – iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: customer_app
    # Production builds: pushes to main and customer-v* tags (scripts/release.sh).
    # integration builds use the customer-android-test workflow below.
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
      tag_patterns:
        - pattern: "customer-v*"
          include: true
    integrations:
      app_store_connect: flariane-asc
    environment:
      # Same Flutter as the local machine, so pubspec.lock resolves identically.
      flutter: 3.24.2
      xcode: latest
      cocoapods: default
      # CERTIFICATE_PRIVATE_KEY: the RSA key behind the distribution
      # certificate, kept as a secret in this Codemagic environment group.
      groups:
        - flariane_signing
      vars:
        BUNDLE_ID: com.regisse.flariane
        APP_STORE_APPLE_ID: "6825787211" # App Store Connect → the app → App Information → Apple ID (numeric)
        API_BASE_URL: https://flariane-api.onrender.com
    scripts:
      - name: Dependencies
        script: |
          flutter pub get
          cd ios && pod install --repo-update
      # Creates the distribution certificate and App Store profile on the first
      # run (through the API key), then reuses them.
      - name: Signing profiles
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Tests
        script: flutter test
        ignore_failure: false
      - name: Build IPA
        script: |
          # Build number = latest TestFlight build + 1, so every upload is
          # accepted without editing pubspec.yaml. Version name stays from pubspec.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          flutter build ipa --release \
            --build-number=$((LATEST + 1)) \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Same tag as customer-ios (scripts/release.sh pushes it), so both stores get the build.
  #
  # One-time setup:
  #   1. Google Cloud: create a service account, download its JSON key, enable the
  #      "Google Play Android Developer API". Play Console → Users and permissions →
  #      invite the service account e-mail with "Release apps to testing tracks".
  #   2. Codemagic → Team settings → Code signing identities → Android keystores:
  #      upload ~/flariane-upload-keystore.jks with reference name "flariane-upload".
  #   3. Codemagic environment group "flariane_play": GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
  #      = contents of the JSON key (secret).
  customer-android:
    name: Customer app – Android → Google Play (closed test)
    instance_type: linux_x2
    max_build_duration: 45
    working_directory: customer_app
    # Production builds: pushes to main and customer-v* tags (scripts/release.sh).
    # integration builds use the customer-android-test workflow below.
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
      tag_patterns:
        - pattern: "customer-v*"
          include: true
    environment:
      flutter: 3.24.2
      java: 17
      android_signing:
        - flariane-upload
      groups:
        - flariane_play
      vars:
        PACKAGE_NAME: com.regisse.flariane
        PLAY_TRACK: alpha # closed test "Geschlossener Test – Alpha"
        API_BASE_URL: https://flariane-api.onrender.com
    scripts:
      - name: Dependencies
        script: flutter pub get
      - name: Tests
        script: flutter test
      - name: Build AAB
        script: |
          # Build number = highest version code on any Play track + 1, like the iOS build.
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0)
          flutter build appbundle --release \
            --build-number=$((LATEST + 1)) \
            --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $PLAY_TRACK
        # Managed publishing is off, so a completed release goes to Google review by itself.
        submit_as_draft: false

  # Test builds from the integration branch, against the test backend. Nothing is published:
  # no Google Play upload and no TestFlight, so a test build never reaches testers or shares
  # build numbers with the production workflows. Download the APK from the build's artifacts.
  #
  # The APK has the production package name (com.regisse.flariane) and is signed with the
  # upload key, so it replaces a debug install but not a Play-installed app: uninstall the
  # Play version first on the phone you test with.
  customer-android-test:
    name: Customer app – Android test APK (integration)
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: customer_app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "integration"
          include: true
          source: true
    environment:
      flutter: 3.24.2
      java: 17
      android_signing:
        - flariane-upload
      vars:
        API_BASE_URL: https://flariane-api-test.onrender.com
    scripts:
      - name: Dependencies
        script: flutter pub get
      - name: Tests
        script: flutter test
      - name: Build APK
        script: |
          flutter build apk --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE_URL="$API_BASE_URL"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
